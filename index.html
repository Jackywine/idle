<style>
  :root{

    font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;

  #stage{position:fixed;inset:0;background:var(--ink);overflow:hidden;isolation:isolate}
  #art{position:absolute;inset:0;width:100%;height:100%;display:block}
  #grain{
    position:absolute;top:-50%;left:-50%;width:200%;height:200%;pointer-events:none;
    opacity:.045;mix-blend-mode:overlay;

    animation:grain 6s steps(6) infinite;

  @keyframes grain{
    0%{transform:translate(0,0)} 20%{transform:translate(-3%,2%)}
    40%{transform:translate(2%,-3%)} 60%{transform:translate(-2%,-2%)}

  /* ---------- HUD ---------- */
  .hud{
    position:fixed;left:0;right:0;z-index:6;pointer-events:none;

    transition:opacity .8s ease;

  .hud.top{top:clamp(20px,3.4vh,44px);display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
  .brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
  .brand b{font-weight:500;letter-spacing:.3em;font-size:11.5px}
  .brand i{font-style:normal;opacity:.42;letter-spacing:.3em;font-size:9.5px}
  .brand .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55;display:inline-block;transform:translateY(-1px)}

  .meta span{opacity:.5}

  .meta #tc{font-variant-numeric:tabular-nums;opacity:.82}

  .hud.bottom{bottom:clamp(20px,3.4vh,40px);mix-blend-mode:normal}
  .track{position:relative;height:22px;display:flex;align-items:center;pointer-events:auto;cursor:none}
  .track:before{content:"";position:absolute;left:0;right:0;height:1px;background:rgba(242,239,232,.16);transition:height .35s cubic-bezier(.2,.8,.2,1),background .35s}
  .track .fill{position:absolute;left:0;height:1px;width:0;background:rgba(242,239,232,.72);transition:height .35s cubic-bezier(.2,.8,.2,1)}

  .track:hover:before,.track:hover .fill{height:2px;background:rgba(242,239,232,.9)}
  .track:hover .knob{transform:translate(-50%,-50%) scale(1)}
  .chapmarks{position:absolute;left:0;right:0;top:50%;height:0;pointer-events:none}
  .chapmarks u{position:absolute;top:-4px;width:1px;height:9px;background:rgba(242,239,232,.22);transition:height .35s,background .35s}
  .track:hover .chapmarks u{height:13px;top:-6px;background:rgba(242,239,232,.5)}
  .hint{
    position:absolute;bottom:calc(100% + 12px);transform:translateX(-50%);
    font-size:9.5px;letter-spacing:.18em;color:rgba(242,239,232,.5);
    opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;

  .hud.bottom .legend{display:flex;justify-content:space-between;margin-top:9px;font-size:9px;letter-spacing:.2em;color:rgba(242,239,232,.26);opacity:0;transition:opacity .6s}

  #cur{
    position:fixed;left:0;top:0;width:6px;height:6px;border-radius:50%;background:var(--paper);
    transform:translate(-50%,-50%);pointer-events:none;z-index:20;mix-blend-mode:difference;opacity:0;

  #curRing{

<script>
/* =========================================================================
   空转 / IDLE
   一次关于 AI 与虚无的观测
   ========================================================================= */
const NS = 'http://www.w3.org/2000/svg';
const DUR = 300;
const TIME = 3.0;            // 场景时间倍率：内部 300s → 实际 DUR/TIME
const REAL = DUR / TIME;

/* =========================================================================
   声音：全程序化合成，零素材
   ========================================================================= */
const SND = {
  ctx:null, master:null, dry:null, wet:null, conv:null,
  droneG:null, drone:[], chordNodes:null, ready:false, muted:false,

  init(){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return false;
    try{
      const c = this.ctx = new AC();
      this.master = c.createGain();
      this.master.gain.value = 0.85;
      this.master.connect(c.destination);

      this.conv = c.createConvolver();
      this.conv.buffer = this.ir(3.4, 2.6);
      this.wet = c.createGain(); this.wet.gain.value = 0.4;
      this.wet.connect(this.conv); this.conv.connect(this.master);

      this.dry = c.createGain(); this.dry.gain.value = 0.95;
      this.dry.connect(this.master);

      this.droneG = c.createGain();
      this.droneG.gain.value = 0.0001;
      const lp = c.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 240; lp.Q.value = 0.7;
      this.droneG.connect(lp);
      lp.connect(this.dry); lp.connect(this.wet);

      [55, 55.42, 110].forEach((f,i)=>{
        const v = this.voice(f,'sine',[0.5,0.5,0.13][i]);
        v.gn.connect(this.droneG);
        this.drone.push(v);
      });

      this.ready = true;
      return true;
    }catch(err){ console.warn('[audio] init failed', err); return false; }
  },

  voice(f, type, g){
    const c = this.ctx;
    const o = c.createOscillator(); o.type = type; o.frequency.value = f;
    const gn = c.createGain(); gn.gain.value = g;
    o.connect(gn); o.start();
    return {o, gn};
  },

  ir(sec, decay){
    const c = this.ctx, rate = c.sampleRate, len = Math.floor(rate*sec);
    const buf = c.createBuffer(2, len, rate);
    for(let ch=0; ch<2; ch++){
      const d = buf.getChannelData(ch);
      for(let i=0;i<len;i++){
        const n = 1 - i/len;
        d[i] = (Math.random()*2-1) * Math.pow(n, decay);
      }
    }
    return buf;
  },

  droneUp(){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    this.droneG.gain.cancelScheduledValues(t);
    this.droneG.gain.setValueAtTime(0.0001, t);
    this.droneG.gain.linearRampToValueAtTime(0.13, t + 4);
  },

  tick(when, freq, gain){
    const c = this.ctx;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(gain, when + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.13);
    o.connect(g); g.connect(this.dry); g.connect(this.wet);
    o.start(when); o.stop(when + 0.2);
  },

  boom(when, gain){
    const c = this.ctx;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(124, when);
    o.frequency.exponentialRampToValueAtTime(33, when + 0.75);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(gain, when + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 1.15);
    o.connect(g); g.connect(this.dry); g.connect(this.wet);
    o.start(when); o.stop(when + 1.3);
  },

  noise(when, dur, freq, gain){
    const c = this.ctx, len = Math.floor(c.sampleRate*dur);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.2);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type='bandpass'; f.frequency.value = freq; f.Q.value = 1.1;
    const g = c.createGain(); g.gain.value = gain;
    src.connect(f); f.connect(g); g.connect(this.dry); g.connect(this.wet);
    src.start(when);
  },

  sweep(when, f1, f2, dur, gain){
    const c = this.ctx, len = Math.floor(c.sampleRate*dur);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 2.6;
    f.frequency.setValueAtTime(f1, when);
    f.frequency.exponentialRampToValueAtTime(f2, when + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(gain, when + dur*0.35);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    src.connect(f); f.connect(g); g.connect(this.dry); g.connect(this.wet);
    src.start(when);
  },

  chord(freqs, when){
    const c = this.ctx;
    if(this.chordNodes){
      const old = this.chordNodes;
      try{
        old.g.gain.cancelScheduledValues(when);
        old.g.gain.setValueAtTime(old.g.gain.value, when);
        old.g.gain.linearRampToValueAtTime(0.0001, when + 2.6);
        old.osc.forEach(o=>{ try{ o.stop(when + 2.8); }catch(e){} });
      }catch(e){}
    }
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(0.048, when + 3.0);
    g.connect(this.dry); g.connect(this.wet);
    const osc = freqs.map(f=>{
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const og = c.createGain(); og.gain.value = 1;
      o.connect(og); og.connect(g); o.start(when);
      return o;
    });
    this.chordNodes = {g, osc};
  },

  setMuted(m){
    this.muted = m;
    if(!this.ready) return;
    this.master.gain.setTargetAtTime(m ? 0 : 0.85, this.ctx.currentTime, 0.12);
  },

  fire(e, at){
    switch(e.kind){
      case 'tick':  this.tick(at, e.a, e.b); break;
      case 'boom':  this.boom(at, e.a); break;
      case 'noise': this.noise(at, e.a, e.b, e.c); break;
      case 'sweep': this.sweep(at, e.a, e.b, e.c, e.d); break;
      case 'chord': this.chord(e.a, at); break;
    }
  }
};

/* ---------- 声音事件表（内部时间轴，单位秒） ---------- */
const EVENTS = [];
const ev = (t, kind, a, b, c, d) => EVENTS.push({t, kind, a, b, c, d});

/* 序 */
ev(3.3,'tick',1180,0.018);

/* 壹 */

ev(33.4,'tick',880,0.018);
ev(36.0,'tick',840,0.015);

ev(43.2,'boom',0.17);
for(let k=0;k<44;k++){
  ev(43.2 + k*0.41, 'tick', 880 + (k*53)%420, 0.010 + (k%5)*0.0012);
}
ev(64.2,'tick',520,0.018);

/* 贰 */
ev(82.0,'chord',[110,155.56]);
ev(83.6,'tick',1080,0.014);
for(let i=0;i<5;i++) ev(86.8 + i*0.24, 'tick', 680 + i*64, 0.015);
ev(97.5,'noise',0.5,300,0.022);
ev(100.3,'boom',0.21);
ev(106.6,'sweep',180,3400,1.7,0.038);
ev(112.8,'boom',0.27);
ev(119.4,'tick',820,0.018);
ev(126.6,'tick',720,0.018);
ev(128.6,'boom',0.19);

/* 叁 */
ev(134.0,'chord',[110,123.47,164.81]);
ev(134.2,'sweep',240,1700,2.2,0.030);
ev(137.2,'tick',900,0.014);
ev(148.4,'sweep',1500,170,2.8,0.042);
ev(162.8,'tick',700,0.018);
ev(170.4,'boom',0.26);
ev(175.9,'tick',1240,0.016);

/* 肆 */
ev(186.0,'chord',[110,220]);
ev(186.2,'noise',1.1,520,0.028);
ev(188.3,'tick',760,0.016);
ev(195.2,'sweep',1100,150,2.6,0.034);

/* 伍 */
ev(232.5,'chord',[110,138.59,164.81]);
ev(232.6,'noise',0.7,880,0.038);
ev(236.2,'tick',820,0.016);
ev(242.6,'tick',760,0.016);
ev(249.2,'tick',700,0.016);
ev(256.8,'tick',680,0.016);

/* ---------- 基础工具 ---------- */
const clamp = (v,a=0,b=1)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const ease = {
  outExpo:  t=> t>=1?1:1-Math.pow(2,-10*t),
  outQuint: t=> 1-Math.pow(1-t,5),
  outCubic: t=> 1-Math.pow(1-t,3),
  inOutQuint:t=> t<.5 ? 16*t*t*t*t*t : 1-Math.pow(-2*t+2,5)/2,
  inOutCubic:t=> t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2,
  inOutSine: t=> -(Math.cos(Math.PI*t)-1)/2,
  outBack:  t=> 1+2.2*Math.pow(t-1,3)+1.4*Math.pow(t-1,2),
  inExpo:   t=> t<=0?0:Math.pow(2,10*t-10),
};
const prog = (t,t0,d=1)=> clamp((t-t0)/d);

function mk(tag, attrs){
  const e = document.createElementNS(NS, tag);
  if(attrs) for(const k in attrs){ if(attrs[k]!=null) e.setAttribute(k, attrs[k]); }
  return e;
}
function add(parent, tag, attrs){ const e=mk(tag,attrs); parent.appendChild(e); return e; }

/* 文字：默认 central 垂直居中 */
function TXT(parent, str, o){
  o = o || {};
  let fsize = o.size || 24;
  // 自适应：任何一行都不得越过安全边距
  if(!o.noFit){
    const ls0 = o.ls != null ? o.ls : 0;
    const maxW = (typeof W === 'number' ? W : 1600) - 2*M() - 28;
    const need = measureStr(str, fsize, ls0);
    if(need > maxW && need > 0) fsize = fsize * maxW / need;
  }
  const t = mk('text', {
    x:o.x||0, y:o.y||0,
    'font-size': fsize,
    'font-family': o.font || F_SANS,
    'font-weight': o.weight || 400,
    'letter-spacing': o.ls!=null ? o.ls : 0,
    'text-anchor': o.anchor || 'start',
    'dominant-baseline': 'central',
    fill: o.fill || C.paper,
    opacity: o.opacity!=null ? o.opacity : 1,
  });
  t.textContent = str;
  parent.appendChild(t);
  return t;
}

/* 逐字打字行 */
function typeLine(parent, str, o){
  o = o||{};
  const size = o.size||26, ls = o.ls||0;
  const chars = Array.from(str);
  const cw = chars.map(ch=> charW(ch,size));
  const total = cw.reduce((a,b)=>a+b,0) + ls*(chars.length-1);
  const x0 = o.anchor==='middle' ? (o.x - total/2) : o.x;
  const y = o.y;
  const g = add(parent,'g',{});
  let cx = x0;
  const els = chars.map((ch,i)=>{
    const t = TXT(g, ch, {x:cx, y:y, size:size, ls:ls, font:o.font, weight:o.weight, fill:o.fill});
    t.setAttribute('opacity', 0);
    cx += cw[i] + ls;
    return t;
  });
  const caret = add(g,'rect',{x:x0, y:y-size*0.46, width:Math.max(1.4,size*0.045), height:size*0.92, fill:o.fill||C.paper, opacity:0});
  return {
    g, els, caret, x0, size, chars,
    totalWidth: total,
    set(n, op=1){
      for(let i=0;i<els.length;i++) els[i].setAttribute('opacity', i<n?op:0);
      const px = n<=0 ? x0 : (x0 + cw.slice(0,n).reduce((a,b)=>a+b,0) + ls*(n-1) + (n>0?cw[n-1]*0 : 0));
      caret.setAttribute('x', n>=chars.length ? x0+total : px);
      caret.setAttribute('opacity', op);
    }
  };
}
function measureStr(str, size, ls){
  let w = 0;
  for(const ch of str) w += charW(ch, size);
  return w + ls*Math.max(0, str.length-1);
}
function charW(ch,size){
  if(/[\s]/.test(ch)) return size*0.42;
  if(/[\u4e00-\u9fff\u3000-\u303f\uff00-\uffef]/.test(ch)) return size;
  if(/[A-Z]/.test(ch)) return size*0.66;
  return size*0.55;
}

/* 逐字入场：每个字独立延迟 */
function chars(parent, str, o){
  o = o||{};
  const size = o.size||30, ls = o.ls||0;
  const arr = Array.from(str);
  const total = arr.reduce((a,ch)=>a+charW(ch,size),0) + ls*Math.max(0,arr.length-1);
  let x = o.anchor==='middle' ? o.x - total/2 : o.x;
  const els = arr.map(ch=>{
    const t = TXT(parent, ch, {x:x, y:o.y, size:size, font:o.font, weight:o.weight, fill:o.fill, opacity:0});
    x += charW(ch,size) + ls;
    return t;
  });
  return {
    els, total,
    set(p, dist=28){
      const n = els.length;
      const span = n>1 ? 0.55 : 0;
      els.forEach((el,i)=>{
        const start = n>1 ? (i/(n-1))*span : 0;
        const k = clamp((p - start)/(1-span));
        const e = ease.outCubic(k);
        el.setAttribute('opacity', e);
        el.setAttribute('transform', `translate(0 ${(1-ease.outQuint(k))*dist})`);
      });
    }
  };
}

/* 出现动画：translateY + opacity */
function appear(g, t, t0, dur=0.9, dist=22, e=ease.outQuint){
  if(g.parentNode && g.parentNode.tagName === 'g') g.parentNode.setAttribute('opacity', 1);
  const p = clamp((t-t0)/(dur*TIME)), k = e(p);
  g.setAttribute('opacity', p<=0?0:k);
  g.setAttribute('transform', `translate(0,${(1-k)*dist})`);
  return p;
}
function fadeTo(g, t, t0, dur=0.8, from=1, to=0){
  const p = ease.inOutCubic(clamp((t-t0)/(dur*TIME)));
  g.setAttribute('opacity', lerp(from,to,p));
  return p;
}

/* 中文数量级计数 */
const CN_UNITS = ['','万','亿','万亿','兆','京','垓','秭','穰'];
function fmtCount(v){
  if(v < 10000) return { n: Math.floor(v).toString(), u:'' };
  let lv = Math.floor(Math.log10(v)/4);
  lv = Math.min(lv, CN_UNITS.length-1);
  const m = v / Math.pow(10, lv*4);
  const d = m < 10 ? 2 : (m < 100 ? 1 : 0);
  let n = m.toFixed(d);
  if(n.length > 5) n = m.toFixed(0);
  return { n, u: CN_UNITS[lv] };
}

/* 种子随机 */
function rng(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function samplePath(d, n){
  const p = mk('path',{d, fill:'none'});
  p.setAttribute('opacity','0');
  svg.appendChild(p);
  const L = p.getTotalLength();
  const out = [];
  for(let i=0;i<=n;i++){ const q = p.getPointAtLength(L*i/n); out.push([q.x,q.y]); }
  p.remove();
  return out;
}

/* =========================================================================
   引擎
   ========================================================================= */
let T = 0, playing = false, lastTs = 0, origin = 0, evIdx = 0;
const built = new Map();
let curScene = null;

function buildAll(){
  svg.innerHTML = '';
  built.clear();
  curScene = null;
  SCENES.sort((a,b)=>a.t0-b.t0);
  SCENES.forEach(s=>{
    let rec;
    try { rec = s.build(); }
    catch(err){
      console.error('[scene build failed]', s.id, err);
      rec = { g: mk('g'), render(){} };
    }
    rec.g.style.display = 'none';
    svg.appendChild(rec.g);
    built.set(s.id, rec);
  });
  // 章节刻度
  const marks = document.getElementById('chapmarks');
  marks.innerHTML = '';
  SCENES.forEach((s,i)=>{
    if(i===0) return;
    const u = document.createElement('u');
    u.style.left = (s.t0/DUR*100)+'%';
    marks.appendChild(u);
  });
}

function sceneAt(t){
  let s = SCENES[0];
  for(const k of SCENES){ if(t >= k.t0) s = k; }
  return s;
}

function fmt(t){
  t = Math.max(0, Math.min(DUR, t));
  const m = Math.floor(t/60), sec = Math.floor(t%60);
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}

const elFill = document.getElementById('fill');
const elKnob = document.getElementById('knob');
const elTC   = document.getElementById('tc');
const elChap = document.getElementById('chap');

let lastChap = '';
function render(t){
  const s = sceneAt(t);
  if(s !== curScene){
    if(curScene) built.get(curScene.id).g.style.display = 'none';
    curScene = s;
    built.get(s.id).g.style.display = '';
  }
  try { built.get(s.id).render(t); }
  catch(err){ if(!render._warned){ console.error('[scene render failed]', s.id, err); render._warned = true; } }

  elFill.style.width = (clamp(t/DUR)*100)+'%';
  elKnob.style.left  = (clamp(t/DUR)*100)+'%';
  elTC.textContent   = fmt(t/TIME);
  const hudA = clamp((t-1.4)/1.2) * (1 - clamp((t-297.2)/1.8));
  document.querySelector('.hud.top').style.opacity = hudA;
  document.querySelector('.hud.bottom').style.opacity = hudA * 0.95;
  if(s.name !== lastChap){
    elChap.textContent = s.name;
    elChap.classList.remove('flip');
    void elChap.offsetWidth;
    elChap.classList.add('flip');
    lastChap = s.name;
  }
}

let manualSeek = false;

function scheduleSound(){
  if(!SND.ready || SND.ctx.state !== 'running') return;
  const now = SND.ctx.currentTime;
  const ahead = now + 0.25;
  while(evIdx < EVENTS.length){
    const e = EVENTS[evIdx];
    const at = origin + e.t / TIME;
    if(at > ahead) break;
    if(at > now - 0.08) SND.fire(e, at);
    evIdx++;
  }
}

function loop(ts){
  if(playing){
    if(SND.ready && SND.ctx.state === 'running' && !manualSeek){
      T = Math.min(DUR, (SND.ctx.currentTime - origin) * TIME);
    } else {
      if(!lastTs) lastTs = ts;
      const dt = Math.min(0.05, (ts - lastTs)/1000);
      lastTs = ts;
      if(!manualSeek) T = Math.min(DUR, T + dt*TIME);
    }
  }
  manualSeek = false;
  if(T >= DUR){ T = DUR; playing = false; }
  render(T);
  if(SND.ready) scheduleSound();
  requestAnimationFrame(loop);
}

/* ---------- 交互 ---------- */
function startPlayback(){
  if(SND.ready){
    SND.ctx.resume();
    origin = SND.ctx.currentTime - T/TIME;
  }
  lastTs = 0;
  playing = true;
}

function togglePlay(){
  if(T >= DUR - 0.05){ T = 0; evIdx = 0; }
  playing = !playing;
  if(SND.ready){
    if(playing){
      SND.ctx.resume();
      origin = SND.ctx.currentTime - T/TIME;
      evIdx = 0;
      while(evIdx < EVENTS.length && EVENTS[evIdx].t < T) evIdx++;
    } else {
      SND.ctx.suspend();
    }
  }
  lastTs = 0;
}

function seek(t){
  T = clamp(t, 0, DUR);
  manualSeek = true;
  if(SND.ready){
    origin = SND.ctx.currentTime - T/TIME;
    evIdx = 0;
    while(evIdx < EVENTS.length && EVENTS[evIdx].t < T) evIdx++;
  }
  render(T);
}

addEventListener('keydown', e=>{
  if(gateEl && !gateEl.classList.contains('gone')){
    if(e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); enter(true); }
    return;
  }
  if(e.code === 'Space'){ e.preventDefault(); togglePlay(); }
  else if(e.code === 'ArrowRight'){ e.preventDefault(); seek(T + 5*TIME); }
  else if(e.code === 'ArrowLeft'){ e.preventDefault(); seek(T - 5*TIME); }
  else if(e.code === 'KeyF'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
});

document.getElementById('stage').addEventListener('click', e=>{
  if(e.target.closest('.hud')) return;
  if(T >= DUR - 0.05){ seek(0); playing = true; lastTs = 0; return; }
  togglePlay();
});

/* 进度条拖拽 */
const track = document.getElementById('track');
let dragging = false;
function posToTime(clientX){
  const r = track.getBoundingClientRect();
  return clamp((clientX - r.left)/r.width) * DUR;
}
track.addEventListener('pointerdown', e=>{
  dragging = true; track.setPointerCapture(e.pointerId);
  seek(posToTime(e.clientX));
});
const elTip = document.getElementById('tip');
track.addEventListener('pointermove', e=>{
  const tt = posToTime(e.clientX);
  const r = track.getBoundingClientRect();
  elTip.style.left = (e.clientX - r.left) + 'px';
  elTip.textContent = fmt(tt);
  if(dragging) seek(tt);
});
track.addEventListener('pointerup', e=>{ dragging = false; });
track.addEventListener('pointercancel', ()=>{ dragging = false; });

/* 光标 */
const curEl = document.getElementById('cur');
const ringEl = document.getElementById('curRing');
let mx = innerWidth/2, my = innerHeight/2, rx = mx, ry = my;
addEventListener('pointermove', e=>{
  mx = e.clientX; my = e.clientY;
  ringEl.style.opacity = '1';
  const hot = !!e.target.closest('.track');
  document.body.classList.toggle('hot', hot);
});
function cursorLoop(){
  rx = lerp(rx, mx, 0.14);
  ry = lerp(ry, my, 0.14);
  curEl.style.transform = `translate(${mx}px,${my}px) translate(-50%,-50%)`;
  curEl.style.opacity = '1';
  ringEl.style.transform = `translate(${rx}px,${ry}px) translate(-50%,-50%)`;
  requestAnimationFrame(cursorLoop);
}

/* 视差 */
let px = 0, py = 0, tx = 0, ty = 0;
addEventListener('pointermove', e=>{
  tx = (e.clientX/innerWidth - .5) * 16;
  ty = (e.clientY/innerHeight - .5) * 12;
});

/* ---------- 进入页 ---------- */
const gateEl = document.getElementById('gate');
const muteEl = document.getElementById('mute');

function enter(withSound){
  gateEl.classList.add('gone');
  if(withSound && SND.init()){
    SND.ctx.resume();
    SND.droneUp();
    muteEl.classList.add('on');
    muteEl.classList.remove('off');
  } else if(SND.ready){
    SND.setMuted(true);
    muteEl.classList.add('on','off');
  }
  startPlayback();
}

gateEl.addEventListener('click', e=>{
  if(e.target.closest('.g-mute')) return;
  enter(true);
});
const gm = document.querySelector('.g-mute');
if(gm) gm.addEventListener('click', e=>{ e.stopPropagation(); enter(false); });

muteEl.addEventListener('click', e=>{
  e.stopPropagation();
  if(!SND.ready) return;
  SND.setMuted(!SND.muted);
  muteEl.classList.toggle('off', SND.muted);
});

/* ---------- 启动 ---------- */
const qs = new URLSearchParams(location.search);
if(qs.has('t')){ T = clamp(parseFloat(qs.get('t')) || 0, 0, DUR); if(!qs.has('pause')) playing = true; }
if(qs.has('pause')) playing = false;
if(qs.has('t')){
  const gateEl = document.getElementById('gate');
  if(gateEl) gateEl.style.display = 'none';
}

computeLayout();
buildAll();
render(T);

addEventListener('resize', ()=>{
  const oldP = PORTRAIT;
  computeLayout();
  if(oldP !== PORTRAIT){
    const keep = T;
    buildAll();
    render(keep);
  }
});

requestAnimationFrame(loop);
requestAnimationFrame(cursorLoop);


</script>
</body>
</html>
